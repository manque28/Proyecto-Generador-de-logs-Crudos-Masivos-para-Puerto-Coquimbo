<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="440" fill="#FFFFFF"/>

  <!-- tramos de la linea de tiempo -->
  <text x="60" y="44" font-size="22" font-weight="800" fill="#0F2E5C">Transformaciones</text>
  <text x="60" y="70" font-size="15" font-style="italic" font-weight="600" fill="#2F80ED">Solo se anotan: no leen ni mueven datos</text>
  <text x="790" y="44" font-size="22" font-weight="800" fill="#0F2E5C">Acción</text>
  <text x="1010" y="44" font-size="22" font-weight="800" fill="#0F2E5C">Spark ejecuta</text>

  <!-- eje -->
  <line x1="110" y1="140" x2="1180" y2="140" stroke="#0F2E5C" stroke-width="3"/>
  <line x1="690" y1="104" x2="690" y2="176" stroke="#2F80ED" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- nodos -->
  <g fill="#1E4FA3">
    <circle cx="160" cy="140" r="24"/>
    <circle cx="380" cy="140" r="24"/>
    <circle cx="600" cy="140" r="24"/>
    <circle cx="840" cy="140" r="30"/>
    <circle cx="1100" cy="140" r="24"/>
  </g>
  <g font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    <text x="160" y="146">1</text>
    <text x="380" y="146">2</text>
    <text x="600" y="146">3</text>
    <text x="840" y="147">!</text>
    <text x="1100" y="146">4</text>
  </g>

  <!-- bloques -->
  <rect x="60" y="196" width="200" height="104" fill="#EAF1FA"/>
  <text x="80" y="232" font-size="19" font-weight="700" fill="#0F2E5C">read + esquema</text>
  <text x="80" y="262" font-size="15" fill="#231F20">dónde leer y con</text>
  <text x="80" y="284" font-size="15" fill="#231F20">qué tipos</text>

  <rect x="280" y="196" width="200" height="104" fill="#D6E4F5"/>
  <text x="300" y="232" font-size="19" font-weight="700" fill="#0F2E5C">filter</text>
  <text x="300" y="262" font-size="15" fill="#231F20">qué filas quedarse</text>

  <rect x="500" y="196" width="200" height="104" fill="#EAF1FA"/>
  <text x="520" y="232" font-size="19" font-weight="700" fill="#0F2E5C">select</text>
  <text x="520" y="262" font-size="15" fill="#231F20">qué columnas usar</text>

  <rect x="740" y="196" width="200" height="104" fill="#1E4FA3"/>
  <text x="760" y="232" font-size="19" font-weight="700" fill="#FFFFFF">count() · show()</text>
  <text x="760" y="262" font-size="15" fill="#FFFFFF">pide un resultado:</text>
  <text x="760" y="284" font-size="15" fill="#FFFFFF">la orden de empezar</text>

  <rect x="960" y="196" width="260" height="158" fill="#D6E4F5"/>
  <text x="980" y="230" font-size="15" fill="#231F20">1 · mira el plan completo</text>
  <text x="980" y="258" font-size="15" fill="#231F20">2 · busca la forma más rápida</text>
  <text x="980" y="286" font-size="15" fill="#231F20">3 · reparte las tareas</text>
  <text x="998" y="308" font-size="15" fill="#231F20">entre los executors</text>
  <text x="980" y="338" font-size="15" font-style="italic" font-weight="700" fill="#2F80ED">recién aquí se leen los datos</text>

  <!-- pie del tramo de transformaciones -->
  <rect x="60" y="324" width="640" height="2" fill="#0F2E5C"/>
  <text x="60" y="356" font-size="16" font-style="italic" font-weight="700" fill="#2F80ED">0 trabajos lanzados</text>
</svg>
