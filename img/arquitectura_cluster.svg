<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F2E5C"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- cabecera de lamina -->
  <text x="80" y="46" font-size="13" font-weight="600" letter-spacing="1.2" fill="#0F2E5C">ENTORNO: UN SOLO EQUIPO · DOCKER DESKTOP · RED: RED-SPARK-LAB</text>
  <line x1="80" y1="60" x2="1200" y2="60" stroke="#0F2E5C" stroke-width="1.5"/>

  <!-- flechas, debajo de las tarjetas -->
  <line x1="446" y1="160" x2="832" y2="160" stroke="#0F2E5C" stroke-width="4" marker-end="url(#punta)"/>
  <line x1="1080" y1="236" x2="1080" y2="318" stroke="#0F2E5C" stroke-width="4" marker-end="url(#punta)"/>
  <line x1="900" y1="236" x2="700" y2="318" stroke="#0F2E5C" stroke-width="4" marker-end="url(#punta)"/>
  <line x1="200" y1="240" x2="200" y2="318" stroke="#0F2E5C" stroke-width="4" marker-start="url(#punta)" marker-end="url(#punta)"/>
  <line x1="380" y1="240" x2="580" y2="318" stroke="#0F2E5C" stroke-width="4" marker-start="url(#punta)" marker-end="url(#punta)"/>
  <line x1="245" y1="496" x2="245" y2="546" stroke="#0F2E5C" stroke-width="4" marker-start="url(#punta)" marker-end="url(#punta)"/>
  <line x1="640" y1="496" x2="640" y2="546" stroke="#0F2E5C" stroke-width="4" marker-start="url(#punta)" marker-end="url(#punta)"/>
  <line x1="1035" y1="496" x2="1035" y2="546" stroke="#0F2E5C" stroke-width="4" marker-start="url(#punta)" marker-end="url(#punta)"/>

  <!-- driver -->
  <rect x="80" y="86" width="360" height="148" fill="#EAF1FA"/>
  <circle cx="134" cy="132" r="28" fill="#FFFFFF"/>
  <rect x="120" y="120" width="28" height="18" rx="2" fill="none" stroke="#0F2E5C" stroke-width="2.5"/>
  <path d="M113,143 h42 M119,147 h30" stroke="#0F2E5C" stroke-width="2.5"/>
  <text x="176" y="141" font-size="28" font-weight="800" fill="#0F2E5C">Driver</text>
  <text x="104" y="188" font-size="18" fill="#231F20">• Planifica y reparte tareas</text>
  <text x="104" y="218" font-size="18" fill="#231F20">• Recibe resultados</text>

  <!-- master -->
  <rect x="840" y="86" width="360" height="148" fill="#D6E4F5"/>
  <circle cx="894" cy="132" r="28" fill="#FFFFFF"/>
  <rect x="880" y="118" width="28" height="11" fill="none" stroke="#0F2E5C" stroke-width="2.5"/>
  <rect x="880" y="135" width="28" height="11" fill="none" stroke="#0F2E5C" stroke-width="2.5"/>
  <circle cx="887" cy="123.5" r="2" fill="#0F2E5C"/>
  <circle cx="887" cy="140.5" r="2" fill="#0F2E5C"/>
  <text x="936" y="141" font-size="28" font-weight="800" fill="#0F2E5C">Master</text>
  <text x="864" y="188" font-size="18" fill="#231F20">• Registra workers</text>
  <text x="864" y="218" font-size="18" fill="#231F20">• Asigna recursos</text>

  <!-- workers -->
  <rect x="80" y="324" width="330" height="168" fill="#D6E4F5"/>
  <rect x="475" y="324" width="330" height="168" fill="#EAF1FA"/>
  <rect x="870" y="324" width="330" height="168" fill="#D6E4F5"/>
  <g font-weight="800" font-size="24" fill="#0F2E5C" text-anchor="middle">
    <text x="245" y="378">Worker 1</text>
    <text x="640" y="378">Worker 2</text>
    <text x="1035" y="378">Worker 3</text>
  </g>
  <rect x="105" y="402" width="280" height="64" fill="#FFFFFF"/>
  <rect x="500" y="402" width="280" height="64" fill="#FFFFFF"/>
  <rect x="895" y="402" width="280" height="64" fill="#FFFFFF"/>
  <g text-anchor="middle">
    <text x="245" y="441" font-size="18" font-weight="700" fill="#0F2E5C">Executor</text>
    <text x="640" y="441" font-size="18" font-weight="700" fill="#0F2E5C">Executor</text>
    <text x="1035" y="441" font-size="18" font-weight="700" fill="#0F2E5C">Executor</text>
  </g>

  <!-- badges de los pasos -->
  <rect x="540" y="142" width="200" height="36" rx="18" fill="#2F80ED"/>
  <text x="640" y="166" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 · Pide recursos</text>
  <rect x="24" y="261" width="352" height="38" rx="19" fill="#2F80ED"/>
  <text x="200" y="286" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3 · Envía tareas y recibe resultados</text>
  <rect x="966" y="261" width="228" height="36" rx="18" fill="#2F80ED"/>
  <text x="1080" y="285" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 · Lanza ejecutores</text>
  <rect x="662" y="503" width="178" height="34" rx="17" fill="#2F80ED"/>
  <text x="751" y="526" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 · Lee / Escribe</text>

  <!-- volumen compartido: dos barras planas apiladas -->
  <rect x="80" y="552" width="1120" height="62" fill="#2F80ED"/>
  <text x="640" y="591" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">Volumen compartido: /opt/workspace (misma ruta en todos los contenedores)</text>
  <rect x="80" y="614" width="1120" height="76" fill="#0F2E5C"/>
  <text x="640" y="646" font-size="17" fill="#EAF1FA" text-anchor="middle" font-family="JetBrains Mono, Consolas, Menlo, monospace">data/raw/w16/ (16 archivos .jsonl) ➔ salida_fase2/ (Parquet)</text>
  <text x="640" y="674" font-size="14" font-style="italic" fill="#D6E4F5" text-anchor="middle">Los datos se leen y escriben directamente: no pasan por el driver</text>
</svg>
