# docker-compose.yml de la fase 2: cluster spark simulado en un solo equipo.
# spark-master reparte recursos, los spark-worker aportan cores y memoria
# (ahi corren los executors) y jupyter es el driver donde vive el notebook.
# todos los valores salen del .env que esta al lado.

name: ${COMPOSE_PROJECT_NAME:-fase2-spark}

# bloque comun que heredan los tres servicios
x-spark-comun: &spark-comun
  build:
    context: ./docker
  image: fase2/spark-lab:4.0.1     # una sola imagen para los tres roles (informe, 5.1)
  env_file: .env                   # SPARK_EXECUTOR_MEMORY y SPARK_DRIVER_MEMORY llegan a spark
  volumes:
    # MISMA ruta en todos los nodos: cada executor abre los .jsonl por su cuenta,
    # no es el driver quien los lee y reparte (informe, 5.4)
    - ./:/opt/workspace
  networks: [lab]

services:

  spark-master:
    <<: *spark-comun
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"                # ui del master

  spark-worker:
    <<: *spark-comun
    # sin container_name: compose numera las replicas (spark-worker-1, -2, ...)
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES}", "--memory", "${SPARK_WORKER_MEMORY}"]
    depends_on: [spark-master]
    deploy:
      replicas: ${SPARK_WORKERS}   # escalar: docker compose up -d --scale spark-worker=4

  jupyter:
    <<: *spark-comun
    container_name: jupyter
    hostname: jupyter              # debe coincidir con spark.driver.host (informe, 5.3)
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
              "--allow-root", "--IdentityProvider.token=${JUPYTER_TOKEN}",
              "--ServerApp.root_dir=/opt/workspace"]
    ports:
      - "${PUERTO_JUPYTER}:8888"   # jupyterlab (8889 en el host)
      - "4040:4040"                # ui del job, solo con una sesion activa
    depends_on: [spark-master, spark-worker]

networks:
  lab:
    name: red-spark-lab
