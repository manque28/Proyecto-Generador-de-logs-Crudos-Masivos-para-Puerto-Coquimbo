# configuracion comun de spark, la misma en los tres roles (informe, 5.3 y 7.3).
#
# driver.host: los executors devuelven los resultados al driver por este nombre.
# sin el, el job queda en RUNNING para siempre sin mostrar ningun error.
# timeZone UTC: los timestamps del generador terminan en Z.
# adaptive.*: AQE ajusta particiones y sesgo con las estadisticas reales.

spark.master                                     spark://spark-master:7077
spark.driver.host                                jupyter
spark.driver.bindAddress                         0.0.0.0
spark.sql.session.timeZone                       UTC
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
spark.sql.adaptive.skewJoin.enabled              true
